name: Bug report
description: Something does not work as described in the README
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please remove passwords, IP addresses you consider private and customer data from anything you paste.
        For security problems, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - Install (manifest.jps)
        - Manage Cluster
        - Add Region / Remove or Forget Region
        - Add Capacity Slice
        - Backup / Restore add-on
        - FUSE / NFS mounts (Volumes dialog or GlusterFS Client add-on)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: The `version` shown for the installed package or add-on (for example 3.2), or the git commit you installed from.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Virtuozzo Application Platform / Jelastic version and hoster, if known.
  - type: input
    id: topology
    attributes:
      label: Cluster layout
      description: Number of regions and storage nodes per region, and which region the problem is in.
  - type: textarea
    id: logs
    attributes:
      label: Tasks log and error messages
      description: Expand the failing entry in the environment's Tasks log and paste its output, plus the exact text of any popup.
      render: text
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
